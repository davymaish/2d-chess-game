<!DOCTYPE html>
<html>
<head>
	<title>2D Chess Game</title>
	<link rel="stylesheet" type="text/css" href="./assets/chess.css">
</head>
<body>
	<h1>2D Chess Game</h1>
	<div id="endscene">
		<p class="winning-sign" role="alert" aria-live="assertive" aria-atomic="true">white wins</p>
		<div class="overlay">
		</div>
		<button id="restart-game" class="restart-game" type="button">Start New Game</button>
	</div>
	<dialog id="promotion-dialog" aria-labelledby="promotion-title">
		<h2 id="promotion-title">Choose a piece to promote to</h2>
		<div class="promotion-options">
			<button type="button" data-promotion="queen">Queen</button>
			<button type="button" data-promotion="rook">Rook</button>
			<button type="button" data-promotion="bishop">Bishop</button>
			<button type="button" data-promotion="knight">Knight</button>
		</div>
	</dialog>

<br>
<div style="width:600px;margin:auto;position:relative;">

		<div id="board" data-orientation="white">
		<div id="final" class="odd">
			<div id="81" class="square" data-square="8-a">
				<img class="piece rook" id="blackRook1" src="./assets/img/blackRook.png">
			</div>
			<div id="82" class="square" data-square="8-b">
				<img class="piece knight" id="blackKnight1" src="./assets/img/blackKnight.png">
			</div>
			<div id="83" class="square" data-square="8-c">
				<img class="piece bishop" id="blackBishop1" data-color="black" src="./assets/img/blackBishop.png">
			</div>
			<div id="84" class="square" data-square="8-d">
				<img class="piece bking" id="blackQueen" data-color="black" src="./assets/img/blackQueen.png">
			</div>
			<div id="85" class="square" data-square="8-e">
				<img class="piece bking" id="blackKing" data-color="black" src="./assets/img/blackKing.png">
			</div>
			<div id="86" class="square" data-square="8-f">
				<img class="piece bishop" id="blackBishop2" data-color="black" src="./assets/img/blackBishop.png">
			</div>
			<div id="87" class="square" data-square="8-g">
				<img class="piece bking" id="blackKnight2" data-color="black" src="./assets/img/blackKnight.png">
			</div>
			<div id="88" class="square" data-square="8-h">
				<img class="piece rook" id="blackRook2" src="./assets/img/blackRook.png">
			</div>
		</div>
		<div class="even">
			<div id="71" class="square" data-square="7-a">
				<img class="piece pawn" id="blackPawn1" src="./assets/img/blackPawn.png">
			</div>
			<div id="72" class="square" data-square="7-b">
				<img class="piece pawn" id="blackPawn2" src="./assets/img/blackPawn.png">
			</div>
			<div id="73" class="square" data-square="7-c">
				<img class="piece pawn" id="blackPawn3" src="./assets/img/blackPawn.png">
			</div>
			<div id="74" class="square" data-square="7-d">
				<img class="piece pawn" id="blackPawn4" src="./assets/img/blackPawn.png">
			</div>
			<div id="75" class="square" data-square="7-e">
				<img class="piece pawn" id="blackPawn5" src="./assets/img/blackPawn.png">
			</div>
			<div id="76" class="square" data-square="7-f">
				<img class="piece pawn" id="blackPawn6" src="./assets/img/blackPawn.png">
			</div>
			<div id="77" class="square" data-square="7-g">
				<img class="piece pawn" id="blackPawn7" src="./assets/img/blackPawn.png">
			</div>
			<div id="78" class="square" data-square="7-h">
				<img class="piece pawn" id="blackPawn8" src="./assets/img/blackPawn.png">
			</div>
		</div>
		<div class="odd">
			<div id="61" class="square" data-square="6-a"></div>

		</div>
		<div class="even">
			<div id="51" class="square" data-square="5-a"></div>

		</div>
		<div class="odd">
			<div id="41" class="square" data-square="4-a"></div>
			<div id="42" class="square" data-square="4-b"></div>

			<div id="31" class="square" data-square="3-a"></div>

			<div id="35" class="square" data-square="3-e"></div>

		</div>
		<div class="odd">
			<div class="square white" id="21" data-square="2-a">
				<img class="piece pawn" id="whitePawn1" src="./assets/img/whitePawn.png">
			</div>
			<div class="square white" id="22" data-square="2-b">
				<img class="piece pawn" id="whitePawn2" src="./assets/img/whitePawn.png">
			</div>
			<div class="square white" id="23" data-square="2-c">

		</div>
		<div class="even">
			<div id="11" class="square white" data-square="1-a">
				<img class="piece rook" id="whiteRook1" src="./assets/img/whiteRook.png">
			</div>
			<div id="12" class="square white" data-square="1-b">
				<img class="piece knight" id="whiteKnight1" src="./assets/img/whiteKnight.png">
			</div>
			<div id="13" class="square white" data-square="1-c">
				<img class="piece bishop" id="whiteBishop1" data-color="white" src="./assets/img/whiteBishop.png">
			</div>
			<div id="14" class="square white" data-square="1-d">
				<img class="piece queen" id="whiteQueen" src="./assets/img/whiteQueen.png">
			</div>
			<div id="15" class="square white" data-square="1-e">
				<img class="piece wking" src="./assets/img/whiteKing.png" class="white" id="whiteKing">
			</div>
			<div id="16" class="square white" data-square="1-f">
				<img class="piece knight" id="whiteBishop2" src="./assets/img/whiteBishop.png">
			</div>
			<div id="17" class="square white" data-square="1-g">
				<img class="piece knight" id="whiteKnight2" src="./assets/img/whiteKnight.png">
			</div>
			<div id="18" class="square white" data-square="1-h">
				<img class="piece rook" id="whiteRook2" src="./assets/img/whiteRook.png">
			</div>
		</div>
	</div>

	<div id="sematary">
		<div id="whiteSematary">
			<div class="pawn"></div>
			<div class="knight"></div>
			<div class="bishop"></div>
			<div class="rook"></div>
			<div class="queen"></div>
		</div>
		<div id="blackSematary">
			<div class="pawn"></div>
			<div class="knight"></div>
			<div class="bishop"></div>
			<div class="rook"></div>
			<div class="queen"></div>
		</div>
	</div>

		<div style="margin-top: 50px;">
			<button id="flip-board" class="flip-board" type="button" onclick="boardAnimate()" aria-pressed="false">Flip Board</button>
			<button id="new-game" class="new-game" type="button">New Game</button>
			<button id="resign-game" class="resign-game" type="button">Resign</button>
			<p id="turn" class="turn-text"> White's Turn</p>
			<p id="game-status" class="game-status" role="status" aria-live="polite" aria-atomic="true">White to move.</p>
			<p id="selection-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">Select a piece to hear its legal destinations.</p>
		</div>
		<section class="chess-clock" aria-labelledby="clock-title">
			<h2 id="clock-title">Chess clock</h2>
			<div class="clock-readouts" role="group" aria-label="Remaining time">
				<div id="white-clock-side" class="clock-side" aria-current="false"><span>White</span><time id="white-clock" role="timer" aria-live="off">5:00</time></div>
				<div id="black-clock-side" class="clock-side" aria-current="false"><span>Black</span><time id="black-clock" role="timer" aria-live="off">5:00</time></div>
			</div>
			<div class="clock-controls">
				<label for="clock-preset">Time control</label>
				<select id="clock-preset">
					<option value="bullet-1-0">Bullet 1+0</option>
					<option value="blitz-3-2">Blitz 3+2</option>
					<option value="blitz-5-0" selected>Blitz 5+0</option>
					<option value="rapid-10-0">Rapid 10+0</option>
					<option value="rapid-15-10">Rapid 15+10</option>
				</select>
				<button id="clock-start" type="button">Start clock</button>
				<button id="clock-pause" type="button" disabled>Pause clock</button>
			</div>
			<p id="clock-status" class="clock-status" role="status" aria-live="polite" aria-atomic="true">Clock not started.</p>
		</section>
		<section class="move-history" aria-labelledby="move-history-title">
			<h2 id="move-history-title">Move history</h2>
			<div class="history-controls" role="group" aria-label="Move history controls">
				<button id="undo-move" type="button" aria-label="Undo last move" title="Undo (Ctrl/Cmd+Z)" disabled>Undo</button>
				<button id="redo-move" type="button" aria-label="Redo last undone move" title="Redo (Ctrl/Cmd+Y or Ctrl/Cmd+Shift+Z)" disabled>Redo</button>
			</div>
			<div id="move-list" class="move-list" role="log" aria-label="Moves played" aria-live="polite" aria-relevant="additions"></div>
			<p id="move-history-empty">Moves will appear here.</p>
		</section>

	<hr style="max-width: 50vw; margin-top: 1vw;">
	<div style="font-size:1.1rem; display: flex; align-items: center; justify-content: center; font-weight: 700;">
		Made with <img height="0.15rem" style="margin: 0.15rem; height: 2rem; width: 2rem;" src="./assets/img/heart.png">by
		<a style="text-decoration: none; color: #15ae66; margin-left: 0.25rem;" 
			target="_blank" 
			href="https://davymaish.github.io">David Maina
		</a>
	</div>
</div>

	<script type="text/javascript" src="./src/chess-clock.js"></script>
		<script type="text/javascript" src="./src/Game.js"></script>
	<script type="text/javascript" src="./src/board-orientation.js"></script>

</body>
</html>
